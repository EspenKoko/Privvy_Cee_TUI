[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-dashboard"
version = "0.1.0"
dependencies = ["textual", "requests", "tomli-w", "keyring", "pydantic"]

[project.scripts]
homelab = "src.app:main"

[tool.setuptools.packages.find]
include = ["src*"]