name: CD

on:
    push:
        branches: ["master"] # TODO Rename branch from main to master
    workflow_dispatch:
        inputs:
            version:
                description: "Enter the version (e.g., v1.0.0)"
                required: true

            # Update to check if branch is master then release and if branch is develop then is a draft and pre release
            draft:
                description: Is this a draft release?
                type: boolean
                required: true
                default: false

            prerelease:
                description: Is this a prerelease?
                type: boolean
                required: true
                default: false

permissions:
    contents: read

jobs:
    # ci:
    #     uses: ./.github/workflows/ci.yml

    build-windows:
        # needs: ci
        environment:
            name: PrivvyCee
        runs-on: windows-latest
        env:
            APP_NAME: ${{ vars.APP_NAME || 'PrivvyCee' }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Build Windows artifacts
              uses: ./.github/actions/build-windows
              with:
                  app-name: ${{ env.APP_NAME }}
                  python-version: ${{ vars.PYTHON_VERSION }}

    build-linux:
        # needs: ci
        environment:
            name: PrivvyCee
        runs-on: ubuntu-latest
        env:
            APP_NAME: ${{ vars.APP_NAME || 'PrivvyCee' }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Build Linux artifact
              uses: ./.github/actions/build-linux
              with:
                  app-name: ${{ env.APP_NAME }}
                  python-version: ${{ vars.PYTHON_VERSION }}

    # Add a way to publish last run artefacts without having to rerun the workflow manually and modify this one 
    release:
        if: github.event_name == 'workflow_dispatch'
        # needs: [ci, build-windows, build-linux]
        needs: [build-windows, build-linux]
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  path: release-assets
                  merge-multiple: true

            - name: List downloaded files
              run: ls -R

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event.inputs.version }}
                  name: Release ${{ github.event.inputs.version }}
                  draft: false
                  prerelease: ${{ github.event.inputs.prerelease }}
                  files: |
                    release-assets/PrivvyCeeTUI-linux.zip
                    release-assets/PrivvyCeeTUI-windows.zip
                    release-assets/PrivvyCeeTUIsetup.exe
