name: Build Windows release assets
description: Build the Windows executable, ZIP, and installer.

inputs:
  app-name:
    description: Name used for the executable and its output directory.
    required: true
  python-version:
    description: Python version used for the build.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Python dependencies
      shell: pwsh
      run: python -m pip install -r requirements.txt

    - name: Install Inno Setup
      shell: pwsh
      run: choco install innosetup -y --no-progress

    - name: Build executable
      shell: pwsh
      env:
        APP_NAME: ${{ inputs.app-name }}
      run: .\.github\scripts\build-exe.ps1 -AppName "$env:APP_NAME"

    - name: Create Windows ZIP
      shell: pwsh
      env:
        APP_NAME: ${{ inputs.app-name }}
      run: |
        Compress-Archive `
          -Path "dist\$env:APP_NAME\*" `
          -DestinationPath 'PrivvyCeeTUI-windows.zip' `
          -Force

    - name: Build installer
      shell: pwsh
      env:
        APP_NAME: ${{ inputs.app-name }}
      run: .\.github\scripts\build-installer.ps1 -AppName "$env:APP_NAME"

    - name: Stage Windows release assets
      shell: pwsh
      run: Copy-Item 'installer-output\PrivvyCeeTUIsetup.exe' -Destination 'PrivvyCeeTUIsetup.exe' -Force

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PrivvyCee-windows
        path: |
          PrivvyCeeTUI-windows.zip
          PrivvyCeeTUIsetup.exe
        if-no-files-found: error
